<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ResearchFlow">
  <title>ResearchFlow</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/@azure/msal-browser@4.30.0/lib/msal-browser.min.js"></script>
</head>
<body>
  <div id="toast" class="toast" aria-live="polite"></div>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand-row">
        <div class="app-icon">RF</div>
        <div>
          <div class="brand">ResearchFlow</div>
          <div class="brand-sub">Research organizer</div>
        </div>
        <button class="icon-button mobile-only" id="closeSidebarBtn" aria-label="Close menu">×</button>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-view="dashboard"><span>▦</span>Dashboard</button>
        <button class="nav-item" data-view="meetings"><span>◫</span>Meetings <span class="badge" id="meetingBadge">0</span></button>
        <button class="nav-item" data-view="general"><span>☷</span>General Tasks <span class="badge" id="generalBadge">0</span></button>
        <button class="nav-item" data-view="inbox"><span>⌄</span>Inbox <span class="badge" id="inboxBadge">0</span></button>
        <button class="nav-item" data-view="search"><span>⌕</span>Search</button>
        <button class="nav-item" data-view="settings"><span>⚙</span>Settings & Sync</button>
      </nav>

      <div class="sidebar-title">
        <span>Research Projects</span>
        <button class="icon-button" id="newProjectSidebarBtn" title="New project">＋</button>
      </div>
      <div id="projectNav" class="project-nav"></div>

      <div class="sidebar-footer">
        <div class="sync-mini" id="syncMini">Local only</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-button mobile-only" id="openSidebarBtn" aria-label="Open menu">☰</button>
        <div class="topbar-spacer"></div>
        <button class="button secondary" id="quickAddBtn">＋ Quick capture</button>
        <button class="button primary" id="newProjectBtn">＋ New project</button>
      </header>

      <section id="content" class="content"></section>
    </main>
  </div>

  <dialog id="modal" class="modal">
    <form method="dialog" id="modalForm">
      <div class="modal-header">
        <h2 id="modalTitle">Modal</h2>
        <button class="icon-button" value="cancel" aria-label="Close">×</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
      <div id="modalActions" class="modal-actions"></div>
    </form>
  </dialog>

  <script src="app-v0.4.2.js"></script>
</body>
</html>
